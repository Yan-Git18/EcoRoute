
sonar.projectKey=Yan-Git18_EcoRoute
sonar.organization=yan-git18

sonar.projectName=EcoRoute
sonar.projectVersion=1.0

# Código fuente
sonar.sources=lib

# Pruebas
sonar.tests=test
sonar.test.inclusions=**/*_test.dart

# Archivos generados y directorios excluidos
sonar.exclusions=**/*.g.dart,**/*.freezed.dart,**/*.mocks.dart,build/**,.dart_tool/**

# Cobertura
sonar.dart.lcov.reportPaths=coverage/lcov.info

sonar.sourceEncoding=UTF-8
